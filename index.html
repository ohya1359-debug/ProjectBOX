<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ProjectBOX</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="header">
        <div class="header__icons">
         <img class="header__image" src="./assets/images/icon.png" alt="">
         <p class="header__title">Project<span class="title__accent"> BOX</span></p>
        </div>

        <div>
            <a class="header__button" href="https://ohya1359-debug.github.io/my-links/" target="_blank" rel="noopener noreferrer">Whose work?</a>
        </div>
    </header>

    <main class="hero">
        <section class="cards">
            <article class="card">
                <img class="card__image" src="./assets/images/card_image.png" alt="">
                <p class="card__title">Muscle Stamp</p>
                <p class="card__text">筋トレを１タップで記録できる<br> シンプルで続けやすいアプリです。</p>
                <ul class="card__labels">
                    <li class="card__label card__label--live">◉ Live</li>
                    <li class="card__label card__label--ios">iOS App</li>
                    <li class="card__label card__label--fitness">Fitness</li>
                </ul> 
                <a class="card__button" href="https://apps.apple.com/jp/app/id6780130811" target="_blank" rel="noopener noreferrer">
                    <span class="card__button-text">App Storeで見る</span>
                    <span class="card__button-arrow">→</span>
                </a>
            </article>
        </section>
    </main>

    <footer class="footer">
        <p>Coded by <a class="footer__coder" href="https://ohya1359-debug.github.io/my-links/" target="_blank" rel="noopener noreferrer">Kazuki Ohya.</a></p>
        <p>Built with HTML and CSS.</p>
    </footer>
  
</body>
</html>
